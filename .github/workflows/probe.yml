name: probe-opponents
on:
  push:
    branches: [probe-opponents]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [magpie]
    env:
      MAGPIE_COMMIT: 375ad953e20d
      MACONDO_COMMIT: 14c080b57608
    steps:
      - uses: actions/checkout@v4
      - name: Tilefish and CSW24
        run: |
          g++ -O2 -std=c++17 -pthread tilefish.cpp -o tilefish
          sh get-lexicon.sh CSW24
          ./tilefish --lexicon CSW24.kwg "savewords CSW24.txt"
      - name: Build MAGPIE
        if: matrix.engine == 'magpie'
        run: |
          git clone -q https://github.com/jvc56/MAGPIE.git "$HOME/MAGPIE"
          cd "$HOME/MAGPIE" && git checkout -q "$MAGPIE_COMMIT" && git log -1 --format='%H %cI'
          ./download_data.sh > /dev/null
          ls data/lexica | head; ls data | head
          make magpie BUILD=no_pgo_release -j4 > build.log 2>&1 || (tail -40 build.log; exit 1)
          ls obj
          cd "$GITHUB_WORKSPACE" && sh tools/build_magpie_bot.sh "$HOME/MAGPIE"
      - uses: actions/setup-go@v5
        if: matrix.engine == 'macondo'
        with:
          go-version: '1.26.1'
      - name: Build Macondo
        if: matrix.engine == 'macondo'
        run: |
          git clone -q https://github.com/domino14/macondo.git "$HOME/macondo"
          cd "$HOME/macondo" && git checkout -q "$MACONDO_COMMIT" && git log -1 --format='%H %cI'
          cd "$GITHUB_WORKSPACE" && sh tools/build_macondo_bot.sh "$HOME/macondo"
          mkdir -p "$HOME/md/lexica/gaddag"
          cp -r "$HOME/macondo/data/strategy" "$HOME/macondo/data/letterdistributions" "$HOME/md/"
          cp CSW24.kwg CSW24.klv2 "$HOME/md/lexica/gaddag/"
          ls "$HOME/md/strategy" | head
      - name: MAGPIE startup, timed
        if: matrix.engine == 'magpie'
        run: |
          cd "$HOME/MAGPIE"
          ls -la data/lexica | grep -i -E 'csw24|nwl23' || true
          start=$(date +%s)
          (echo isready; sleep 2; echo quit) | timeout 900 ./bin/magpie_bot CSW24 1 > out.txt 2> err.txt; echo "exit $? after $(( $(date +%s) - start )) s"
          cat out.txt; tail -20 err.txt
          ls -la data/lexica | grep -i -E 'csw24|nwl23' || true
      - name: One refereed pair
        timeout-minutes: 15
        run: |
          if [ "${{ matrix.engine }}" = magpie ]; then B="proto:cd $HOME/MAGPIE && ./bin/magpie_bot CSW24 1"; else B="proto:$HOME/macondo/bin/macondo_bot $HOME/md CSW24 1"; fi
          python3 tools/referee.py --lexicon CSW24.txt --games 1 --movetime 1000 --parallel 1 \
            --a "proto:./tilefish --lexicon CSW24.kwg --threads 1 --quiet" --a-name tilefish \
            --b "$B" --b-name "${{ matrix.engine }}" --log probe.jsonl
          python3 tools/analyze.py probe.jsonl
