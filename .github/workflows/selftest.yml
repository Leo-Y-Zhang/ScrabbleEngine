name: selftest
on:
  push:
  pull_request:
jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build (Linux, g++)
        if: runner.os == 'Linux'
        run: g++ -O2 -std=c++17 -pthread -Wall -Werror tilefish.cpp -o tilefish
      - name: Build (macOS, clang++)
        if: runner.os == 'macOS'
        run: clang++ -O2 -std=c++17 -pthread -Wall -Werror tilefish.cpp -o tilefish
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Build (Windows, Visual Studio)
        if: runner.os == 'Windows'
        run: cl /nologo /O2 /std:c++17 /EHsc /Fe:tilefish.exe tilefish.cpp
      - name: Self-test (ENABLE)
        shell: bash
        run: ./tilefish --threads 2 "selftest quick"
      - name: Referee script parses
        if: runner.os == 'Linux'
        run: python3 -m py_compile tools/referee.py tools/analyze.py
      - name: Refereed match, raw log and its analysis
        if: runner.os == 'Linux'
        run: |
          python3 tools/referee.py --lexicon ENABLE.txt --games 2 --movetime 200 --parallel 2 \
            --a "proto:./tilefish --quiet --threads 1" --a-init "player static" --a-name a \
            --b "proto:./tilefish --quiet --threads 1" --b-init "player static" --b-name b --log match.jsonl
          python3 tools/analyze.py match.jsonl --plan 30 --bootstrap 200 | tee analysis.txt
          test "$(grep -c '"meta"' match.jsonl)" = 1
          test "$(grep -vc '"meta"' match.jsonl)" = 4
          grep -q 'W [0-9]* *D [0-9]* *L [0-9]*' analysis.txt
          grep -q 'illegal/crash/slow events: 0' analysis.txt
          grep -q 'bootstrap over pairs (200 resamples)' analysis.txt
          # The same deterministic engine in both seats of every deal pair must come out level.
          grep -q 'match score 2.0 / 4' analysis.txt
