name: selftest
on:
  push:
  pull_request:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: g++ -O2 -std=c++17 -pthread -Wall -Werror tilefish.cpp -o tilefish
      - name: Self-test (ENABLE)
        run: ./tilefish --threads 2 "selftest quick"
      - name: Referee script parses
        run: python3 -m py_compile tools/referee.py
