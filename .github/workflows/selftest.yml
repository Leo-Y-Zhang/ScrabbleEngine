name: selftest
on:
  push:
  pull_request:
jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build (Linux, g++)
        if: runner.os == 'Linux'
        run: g++ -O2 -std=c++17 -pthread -Wall -Werror tilefish.cpp -o tilefish
      - name: Build (macOS, clang++)
        if: runner.os == 'macOS'
        run: clang++ -O2 -std=c++17 -pthread -Wall -Werror tilefish.cpp -o tilefish
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Build (Windows, Visual Studio)
        if: runner.os == 'Windows'
        run: cl /nologo /O2 /std:c++17 /EHsc /Fe:tilefish.exe tilefish.cpp
      - name: Self-test (ENABLE)
        shell: bash
        run: ./tilefish --threads 2 "selftest quick"
      - name: Word-list export matches the source list
        if: runner.os == 'Linux'
        run: |
          ./tilefish "savewords words.txt"
          python3 -c "src={w.strip().upper() for w in open('ENABLE.txt') if w.strip() and len(w.strip())<=15}; out=[w.strip() for w in open('words.txt')]; assert len(out)==len(set(out))==len(src)==168551 and set(out)==src, (len(out), len(src)); print('savewords: 168551 words, identical')"
      - name: Referee script parses
        if: runner.os == 'Linux'
        run: python3 -m py_compile tools/referee.py tools/analyze.py
      - name: Refereed match, raw log and its analysis
        if: runner.os == 'Linux'
        run: |
          python3 tools/referee.py --lexicon ENABLE.txt --games 2 --movetime 200 --parallel 2 \
            --a "proto:./tilefish --quiet --threads 1" --a-init "player static" --a-name a \
            --b "proto:./tilefish --quiet --threads 1" --b-init "player static" --b-name b --log match.jsonl
          python3 tools/analyze.py match.jsonl --plan 30 --bootstrap 200 | tee analysis.txt
          test "$(grep -c '"meta"' match.jsonl)" = 1
          test "$(grep -vc '"meta"' match.jsonl)" = 4
          grep -q 'W [0-9]* *D [0-9]* *L [0-9]*' analysis.txt
          grep -q 'illegal/crash/slow events: 0' analysis.txt
          grep -q 'bootstrap over pairs (200 resamples)' analysis.txt
          # The same deterministic engine in both seats of every deal pair must come out level.
          grep -q 'match score 2.0 / 4' analysis.txt
  windows-lexicon:
    # get-lexicon.bat started from a PowerShell 7 prompt (docs/windows.md).  cmd.exe passes
    # PowerShell 7's PSModulePath on to Windows PowerShell 5.1, which then loads
    # PowerShell 7's Microsoft.PowerShell.Utility and has no Get-FileHash; v2.2 failed there.
    # Each step below tests one claim, and the reproduction is kept apart from the fallback.
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: "The condition: 5.1 started through cmd.exe from PowerShell 7 has no Get-FileHash"
        run: |
          Set-Content probe.ps1 'if (Get-Command Get-FileHash -ErrorAction SilentlyContinue) { "present" } else { "missing" }; (Get-Module Microsoft.PowerShell.Utility -ListAvailable | Select-Object -First 1).Version.ToString()'
          $direct = powershell.exe -NoProfile -ExecutionPolicy Bypass -File probe.ps1
          $viaCmd = cmd /c "powershell.exe -NoProfile -ExecutionPolicy Bypass -File probe.ps1"
          $cleared = cmd /c "set PSModulePath=& powershell.exe -NoProfile -ExecutionPolicy Bypass -File probe.ps1"
          "PowerShell $($PSVersionTable.PSVersion) -> powershell.exe:          $direct"
          "PowerShell 7 -> cmd.exe -> powershell.exe:     $viaCmd"
          "... with PSModulePath cleared in cmd.exe:      $cleared"
          if ($viaCmd[0] -ne 'missing') { throw "not reproduced: Get-FileHash was found through cmd.exe" }
          if ($cleared[0] -ne 'present') { throw "clearing PSModulePath did not restore Get-FileHash" }
      - name: "The original failure: v2.2's get-lexicon, started from PowerShell 7, stops at Get-FileHash"
        run: |
          New-Item -ItemType Directory v22 | Out-Null
          git show v2.2:get-lexicon.ps1 | Set-Content v22/get-lexicon.ps1
          git show v2.2:get-lexicon.bat | Where-Object { $_ -ne 'pause' } | Set-Content v22/get-lexicon.bat
          $out = cmd /c "v22\get-lexicon.bat" 2>&1 | Out-String
          $code = $LASTEXITCODE
          $out
          if ($code -eq 0 -or $out -notmatch "Get-FileHash" -or $out -notmatch "CommandNotFoundException") { throw "v2.2's failure was not reproduced (exit $code)" }
      - name: "The fix on its own: today's get-lexicon.bat runs v2.2's script (which needs Get-FileHash) to completion"
        run: |
          Copy-Item get-lexicon.bat v22/get-lexicon.bat -Force
          $out = cmd /c "echo.| v22\get-lexicon.bat" 2>&1 | Out-String
          $out
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path v22/CSW24.kwg) -or -not (Test-Path v22/CSW24.klv2)) { throw "failed" }
      - name: "Today's get-lexicon.bat from PowerShell 7: downloads and verifies, and a second run recognises the files"
        run: |
          $out = cmd /c "echo.| get-lexicon.bat" 2>&1 | Out-String
          $out
          if ($LASTEXITCODE -ne 0 -or $out -notmatch "Done") { throw "first run failed" }
          $out = cmd /c "echo.| get-lexicon.bat" 2>&1 | Out-String
          $out
          if ($out -notmatch "CSW24.kwg is already here" -or $out -notmatch "CSW24.klv2 is already here") { throw "second run did not recognise the files" }
          if ((Get-FileHash CSW24.kwg).Hash -ne (Get-FileHash v22/CSW24.kwg).Hash) { throw "the two downloads differ" }
      - name: "The fallback (not the original problem): the script works with Get-FileHash made to fail"
        run: |
          Remove-Item CSW24.kwg, CSW24.klv2
          powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "function Get-FileHash { throw 'Get-FileHash is not available' }; & ./get-lexicon.ps1"
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path CSW24.kwg)) { throw "failed" }
