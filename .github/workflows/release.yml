# Builds ready-to-run downloads for Windows, macOS and Linux and publishes them as a
# GitHub release.  Run it from the Actions tab ("release", then "Run workflow").
name: release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v2.1
        required: true
        default: v2.1
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x86_64
          - os: macos-latest
            name: macos
          - os: ubuntu-latest
            name: linux-x86_64
    runs-on: ${{ matrix.os }}
    env:
      PKG: tilefish-${{ inputs.tag }}-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Build (Linux, static, any x86-64 processor from about 2009 on)
        if: runner.os == 'Linux'
        run: g++ -O3 -march=x86-64-v2 -std=c++17 -pthread -static tilefish.cpp -o tilefish
      - name: Build (macOS 11 or later, Apple silicon and Intel in one file)
        if: runner.os == 'macOS'
        run: clang++ -O3 -std=c++17 -pthread -arch arm64 -arch x86_64 -mmacosx-version-min=11.0 tilefish.cpp -o tilefish
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Build (Windows, no runtime libraries needed)
        if: runner.os == 'Windows'
        run: cl /nologo /O2 /MT /std:c++17 /EHsc /Fe:tilefish.exe tilefish.cpp
      - name: Self-test
        shell: bash
        run: ./tilefish --threads 2 "selftest quick"
      # Code signing (docs/windows.md).  Dormant until the owner has a SignPath project and
      # sets the repository variable SIGNPATH_ORGANIZATION_ID and the secret
      # SIGNPATH_API_TOKEN; until then releases are built unsigned, as before.
      - name: Upload the unsigned program for signing
        id: unsigned
        if: runner.os == 'Windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-${{ matrix.name }}
          path: tilefish.exe
      - name: Sign with SignPath (waits for the owner's approval in SignPath)
        if: runner.os == 'Windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'Tilefish' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed
      - name: Use the signed program, and check its signature
        if: runner.os == 'Windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: pwsh
        run: |
          Copy-Item signed/tilefish.exe tilefish.exe -Force
          $sig = Get-AuthenticodeSignature tilefish.exe
          "signature: $($sig.Status), signer: $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "the signed program's signature is not valid" }
          ./tilefish.exe --threads 2 "selftest quick"
      - name: Package
        shell: bash
        run: |
          mkdir "$PKG"
          if [ -f tilefish.exe ]; then
            cp tilefish.exe "$PKG/"
          else
            cp tilefish "$PKG/"
          fi
          cp ENABLE.txt ENABLE.leaves ENABLE.win CSW24.win NWL23.win OXENDICT.txt OXENDICT.klv2 OXENDICT.win CEL.txt CEL.klv2 CEL.win CSW24.klv2 NWL23.klv2 README.md LEXICONS.md LICENSE \
            tools/release/QUICKSTART.txt "$PKG/"
          if [ "$RUNNER_OS" = Windows ]; then 7z a -tzip "$PKG.zip" "$PKG" > /dev/null; else zip -qr "$PKG.zip" "$PKG"; fi
      - name: A player's own copy of a tournament list gets the program's own data for it
        shell: bash
        run: |
          # ENABLE stands in for the player's copy: the download contains no tournament list.
          mkdir mine && cp "$PKG/ENABLE.txt" mine/CSW24.txt
          "$PKG/$(ls "$PKG" | grep -E '^tilefish(\.exe)?$')" --threads 2 --lexicon mine/CSW24.txt "cgp 15/15/15/15/15/15/15/5CAT7/15/15/15/15/15/15/15 AEINRST/ 5/0 0; gen 3" | tee out.txt
          grep -q "lexicon CSW24" out.txt
          grep -q "leave values: .*CSW24.klv2" out.txt
          grep -q "win model from CSW24.win" out.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ env.PKG }}.zip
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          Tilefish, a crossword game engine. To play without installing anything, open
          https://leo-y-zhang.github.io/ScrabbleEngine/ in any browser.

          To run it on your computer, download the zip for your system, unzip it and
          follow QUICKSTART.txt inside:

          1. Start `tilefish` and type `play`. It plays ENABLE, a free list that comes with it,
             as do the Common English Lexicon and British English in Oxford spelling.
          2. Collins and NWL belong to their publishers and are not included: if you have
             a copy you are entitled to use, save it as CSW24.txt or NWL2023.txt next to the
             program, and Tilefish's own leave values for it are picked up.

          The Windows build needs no other software. The macOS build runs on Apple
          silicon and Intel Macs (macOS 11 or later). The Linux build runs on any
          64-bit x86 Linux. Building from source with `build.sh` gives the fastest
          program for your own processor.

          SCRABBLE(R) is a registered trademark of Hasbro, Inc. in the USA and Canada and
          of J.W. Spear & Sons Ltd, a subsidiary of Mattel, Inc., elsewhere. Tilefish is an
          independent project, not affiliated with, sponsored or endorsed by Hasbro, Mattel,
          HarperCollins, NASPA, WESPA, the ABSP, Oxford University Press or Woogles.
          EOF
          gh release create "${{ inputs.tag }}" dist/*.zip --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "Tilefish ${{ inputs.tag }}" --notes-file notes.md
