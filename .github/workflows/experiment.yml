name: experiment
# Engine-vs-engine screening matches on GitHub's runners.  Each job plays its own range
# of deal pairs under tools/referee.py; the summary job pools the raw logs with
# tools/analyze.py.  Start it from the Actions tab or with
#   gh workflow run experiment.yml -f a_spec=champion:plies=3 -f b_ref=v2.1 ...
# Engine B can also be a current opponent, built at a pinned commit by this workflow:
#   -f b_ref=magpie@375ad953e20d -f b_spec=full       MAGPIE's PlayChooser (sim, peg, endgame)
#   -f b_ref=macondo@14c080b57608 -f b_spec="simming 5"   Macondo with BestBot's settings
#   -f b_ref=macondo@14c080b57608 -f b_spec="infer 5"     ... with its rack inference
# (CSW24 or NWL23; each opponent uses the data its own project ships, see tools/).
# Development screens use seeds 1000-8999; keep 9000 and up for confirmation matches.
on:
  workflow_dispatch:
    inputs:
      name: { description: "label for this experiment", default: "screen" }
      a_ref: { description: "git ref that builds engine A (the candidate)", default: "main" }
      a_spec: { description: "engine A setting", default: "champion" }
      b_ref: { description: "engine B: a git ref of Tilefish (default the frozen v2.1), or magpie@COMMIT or macondo@COMMIT", default: "v2.1" }
      b_spec: { description: "engine B setting", default: "champion" }
      movetime: { description: "milliseconds a move", default: "5000" }
      threads: { description: "threads per engine", default: "1" }
      shards: { description: "parallel jobs", default: "10" }
      pairs: { description: "deal pairs per job", default: "20" }
      seed: { description: "deal seed", default: "1001" }
      lexicon: { description: "word list: ENABLE, CSW24 or NWL23", default: "ENABLE" }
      history: { description: "send the game's history (for inference) to: none, a, b or both", default: "none" }
      prefix_until_bag: { description: "if set: a static Tilefish plays both seats until the bag holds this many tiles", default: "" }
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.p.outputs.shards }}
    steps:
      - id: p
        env:
          SHARDS: ${{ inputs.shards }}
        run: python3 -c "import json, os; print('shards=' + json.dumps(list(range(int(os.environ['SHARDS'])))))" >> "$GITHUB_OUTPUT"
  match:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    env:
      A_REF: ${{ inputs.a_ref }}
      B_REF: ${{ inputs.b_ref }}
      A_SPEC: ${{ inputs.a_spec }}
      B_SPEC: ${{ inputs.b_spec }}
      MOVETIME: ${{ inputs.movetime }}
      THREADS: ${{ inputs.threads }}
      PAIRS: ${{ inputs.pairs }}
      SEED: ${{ inputs.seed }}
      SHARD: ${{ matrix.shard }}
      LEX: ${{ inputs.lexicon }}
      HISTORY: ${{ inputs.history }}
      PREFIX_BAG: ${{ inputs.prefix_until_bag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Word list
        run: |
          if [ "$LEX" = ENABLE ]; then
            echo "LEXFILE=ENABLE.txt" >> "$GITHUB_ENV"; echo "WORDS=ENABLE.txt" >> "$GITHUB_ENV"
          else
            sh get-lexicon.sh "$LEX"  # the .kwg and .klv2, checked against pinned SHA-256 sums
            g++ -O2 -std=c++17 -pthread tilefish.cpp -o tf_tools
            ./tf_tools --lexicon "$LEX.kwg" "savewords $LEX.txt"  # the referee checks moves against it
            echo "LEXFILE=$LEX.kwg" >> "$GITHUB_ENV"; echo "WORDS=$LEX.txt" >> "$GITHUB_ENV"
          fi
      - name: Build Tilefish engines
        run: |
          cpu="cpu: $(nproc) x $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2 | xargs); $(lscpu | grep -E '^(Thread\(s\) per core|Core\(s\) per socket|Socket\(s\))' | tr -s ' ' | paste -sd ';' -)"
          echo "CPU_LINE=$cpu" >> "$GITHUB_ENV"
          for side in a b; do
            if [ $side = a ]; then ref=$A_REF; spec=$A_SPEC; else ref=$B_REF; spec=$B_SPEC; fi
            case "$ref" in magpie@*|macondo@*) continue ;; esac
            git show "$ref:tilefish.cpp" > "tf_$side.cpp"
            g++ -O3 -march=native -std=c++17 -pthread "tf_$side.cpp" -o "tf_$side"
            { echo "engine: Tilefish"; echo "commit: $(git rev-parse "$ref^{commit}") ($ref)"; echo "setting: $spec"; echo "toolchain: $(g++ --version | head -n 1), -O3 -march=native"; echo "$cpu"; } > "$side.info"
            cat "$side.info"
            S=$(echo $side | tr a-z A-Z)
            echo "${S}_CMD=proto:./tf_$side --lexicon $LEXFILE --threads $THREADS --quiet" >> "$GITHUB_ENV"
            echo "${S}_INIT=player $spec" >> "$GITHUB_ENV"
          done
      - name: Build MAGPIE
        if: startsWith(inputs.b_ref, 'magpie@')
        run: |
          M="$HOME/MAGPIE"
          git clone -q https://github.com/jvc56/MAGPIE.git "$M" && git -C "$M" checkout -q "${B_REF#magpie@}"
          (cd "$M" && ./download_data.sh > /dev/null)
          (cd "$M" && make magpie BUILD=no_pgo_release -j4 > build.log 2>&1) || (tail -40 "$M/build.log"; exit 1)
          # Its data has no word map for the tournament lists; make one as MAGPIE's convert_lexica.sh does.
          (cd "$M" && bin/magpie convert dawg2text "$LEX" > /dev/null && bin/magpie convert text2wordmap "$LEX" -threads 4 > /dev/null)
          sh tools/build_magpie_bot.sh "$M"
          { cat "$M/bin/magpie_bot.provenance"; echo "mode: ${B_SPEC}"; echo "data: $(grep -m1 '^DATA_VERSION=' "$M/download_data.sh") (download_data.sh), word map made with convert text2wordmap"; echo "$CPU_LINE"; } > b.info
          cat b.info
          echo "B_CMD=proto:cd $M && ./bin/magpie_bot $LEX $THREADS ./data $B_SPEC" >> "$GITHUB_ENV"
          echo "B_INIT=" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        if: startsWith(inputs.b_ref, 'macondo@')
        with:
          go-version: '1.26.1'
      - name: Build Macondo
        if: startsWith(inputs.b_ref, 'macondo@')
        run: |
          M="$HOME/macondo"
          git clone -q https://github.com/domino14/macondo.git "$M" && git -C "$M" checkout -q "${B_REF#macondo@}"
          sh tools/build_macondo_bot.sh "$M"
          D="$HOME/macondo-data"
          mkdir -p "$D/lexica/gaddag" && cp -r "$M/data/strategy" "$M/data/letterdistributions" "$D/"
          cp "$LEX.kwg" "$LEX.klv2" "$D/lexica/gaddag/"
          { cat "$M/bin/macondo_bot.provenance"; echo "bot and plies: ${B_SPEC}"; echo "data: Macondo's strategy and letterdistributions; $LEX.kwg/.klv2 from get-lexicon"; echo "$CPU_LINE"; } > b.info
          cat b.info
          echo "B_CMD=proto:$M/bin/macondo_bot $D $LEX $THREADS $B_SPEC" >> "$GITHUB_ENV"
          echo "B_INIT=" >> "$GITHUB_ENV"
      - name: Play
        run: |
          case "$HISTORY" in a) H="--a-history" ;; b) H="--b-history" ;; both) H="--a-history --b-history" ;; *) H="" ;; esac
          if [ -n "$PREFIX_BAG" ]; then
            # The prefix player: engine A's build playing "static" (deterministic), one thread.
            P=(--prefix "proto:./tf_a --lexicon $LEXFILE --threads 1 --quiet" --prefix-init "player static" --prefix-until-bag "$PREFIX_BAG")
          else
            P=()
          fi
          python3 tools/referee.py $H --history-lexicon "$LEX" "${P[@]}" --lexicon "$WORDS" --games "$PAIRS" --first-pair $((SHARD * PAIRS)) --seed "$SEED" \
            --movetime "$MOVETIME" --parallel $(( $(nproc) / THREADS > 0 ? $(nproc) / THREADS : 1 )) --startup-timeout 900 \
            --a "$A_CMD" --a-init "$A_INIT" --a-name A --a-info a.info \
            --b "$B_CMD" --b-init "$B_INIT" --b-name B --b-info b.info \
            --log "shard-$SHARD.jsonl"
      - uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: shard-${{ matrix.shard }}.jsonl
  summary:
    needs: match
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: logs
          pattern: shard-*
          merge-multiple: true
      - name: Pool and analyse
        env:
          NAME: ${{ inputs.name }}
        run: |
          cat logs/*.jsonl > "$NAME.jsonl"
          { echo "## $NAME"; echo '```'; python3 tools/analyze.py "$NAME.jsonl" --bootstrap 10000 --plan 20 30; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.name }}
          path: ${{ inputs.name }}.jsonl
